<!DOCTYPE html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f92b5">
<title>삼척 여행 대시보드</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="./assets/style.css">

<!-- ===================== 잠금 화면 ===================== -->
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="gate-emoji">🌊</div>
    <h1 class="gate-title">삼척 여행 대시보드</h1>
    <p class="gate-sub">접근 비밀번호를 입력해주세요</p>
    <form id="gate-form" autocomplete="off">
      <input id="gate-input" class="gate-input" type="password" inputmode="numeric"
             maxlength="8" placeholder="••••" aria-label="비밀번호">
      <button class="gate-btn" type="submit">입장</button>
    </form>
    <p id="gate-err" class="gate-err" hidden>비밀번호가 맞지 않아요 🥲</p>
  </div>
</div>

<!-- ===================== 본문 ===================== -->
<main id="app" class="app" hidden>

  <!-- 상단 고정 바 -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-emoji">🌊</span>
      <div class="topbar-txt">
        <div class="topbar-title" id="topbar-title">삼척 1박 2일</div>
        <div class="topbar-sub" id="topbar-sub">한눈에 보기</div>
      </div>
    </div>
    <span class="topbar-dday" id="topbar-dday">–</span>
  </header>

  <!-- ========================================================
       ① 한눈에 보기
       ======================================================== -->
  <section class="view" data-view="home">

    <!-- 히어로 -->
    <div class="card hero">
      <span class="badge" id="hero-badge"></span>
      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-desc" id="hero-desc"></p>

      <div class="dday">
        <div class="dday-label">D-DAY</div>
        <div class="dday-num" id="dday-num">–</div>
        <div class="dday-emoji">🌊</div>
      </div>

      <p class="hero-depart" id="hero-depart"></p>
      <div class="chips" id="hero-chips"></div>
      <div class="chips chips-file" id="hero-files"></div>
    </div>

    <!-- 확정 예약 -->
    <div class="card">
      <h2 class="sec-title">✅ 확정 예약</h2>
      <div id="bookings" class="booking-list"></div>
    </div>

    <!-- 카테고리 바로가기 -->
    <div class="card">
      <h2 class="sec-title">📂 카테고리</h2>
      <div class="qnav-head">
        <span class="qnav-head-label">여행 준비 현황</span>
        <span class="qnav-head-num" id="qnav-count">–</span>
      </div>
      <div class="prog"><div class="prog-bar" id="qnav-prog"></div></div>
      <div class="qnav" id="qnav"></div>
    </div>
  </section>

  <!-- ========================================================
       ② 일정
       ======================================================== -->
  <section class="view" data-view="plan">
    <div class="card">
      <h2 class="sec-title">🗓️ 일정표</h2>
      <p class="sec-sub">날짜를 눌러 하루씩 확인하세요</p>
      <div id="day-tabs" class="tabs"></div>
      <div id="day-panels"></div>
    </div>
  </section>

  <!-- ========================================================
       ③ 지도
       ======================================================== -->
  <section class="view" data-view="map">
    <div class="card">
      <h2 class="sec-title">🗺️ 동선 지도</h2>
      <div id="map-day-tabs" class="tabs"></div>
      <div class="filter-box">
        <div class="filter-row">
          <span class="filter-label">📍 필터:</span>
          <div id="map-cat-filters" class="chips chips-filter"></div>
        </div>
      </div>
      <div class="map-meta">
        <div class="map-meta-title" id="map-meta-title"></div>
        <div class="map-meta-sub" id="map-meta-sub"></div>
      </div>
      <div id="map"></div>
      <div id="map-list" class="place-list"></div>
    </div>
  </section>

  <!-- ========================================================
       ④ 숙박
       ======================================================== -->
  <section class="view" data-view="stay">
    <div class="card">
      <h2 class="sec-title">🏨 숙소</h2>
      <div id="stay"></div>
    </div>
  </section>

  <!-- ========================================================
       ⑤ 맛집
       ======================================================== -->
  <section class="view" data-view="food">
    <div class="card">
      <h2 class="sec-title">🍜 맛집</h2>
      <p class="sec-sub">대표 음식 + 후보 정리</p>
      <h3 class="sub-title" id="food-local-title"></h3>
      <div class="table-wrap">
        <table class="tbl" id="food-local"></table>
      </div>
      <div id="food-cand" class="place-list"></div>
      <p class="note" id="food-note"></p>
    </div>
  </section>

  <!-- ========================================================
       ⑥ 예산
       ======================================================== -->
  <section class="view" data-view="budget">
    <div class="card">
      <h2 class="sec-title">💰 예산</h2>
      <div class="table-wrap">
        <table class="tbl" id="budget"></table>
      </div>
      <div class="budget-total" id="budget-total"></div>
    </div>
  </section>

  <!-- ========================================================
       ⑦ 준비물
       ======================================================== -->
  <section class="view" data-view="prep">
    <div class="card">
      <h2 class="sec-title">🎒 준비물</h2>
      <p class="sec-sub">체크 상태는 브라우저에 저장됩니다 (localStorage)</p>
      <div id="checklist"></div>
      <button id="checklist-reset" class="reset-btn" type="button">체크 초기화</button>
    </div>
  </section>

  <footer class="foot">
    <div id="foot-text"></div>
  </footer>

  <!-- 하단 탭 바 -->
  <nav class="tabbar" aria-label="카테고리">
    <div class="tabbar-inner" id="tabbar"></div>
  </nav>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./assets/data.js"></script>
<script src="./assets/app.js"></script>
</html>
